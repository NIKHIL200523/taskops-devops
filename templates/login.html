<!DOCTYPE html>
<html>
<head>
  <title>TaskOps Login & Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
  <div class="container col-md-4 card p-4 shadow-sm">
    <h3 class="text-center mb-3">TaskOps Sprint Portal</h3>
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    {% if success %}<div class="alert alert-success py-2">{{ success }}</div>{% endif %}

    <h6 class="text-muted">Sign In</h6>
    <form method="POST" action="/" class="mb-3">
      <div class="mb-2"><input type="text" name="username" class="form-control" placeholder="Username (default: admin)" required></div>
      <div class="mb-2"><input type="password" name="password" class="form-control" placeholder="Password (default: admin123)" required></div>
      <button class="btn btn-primary w-100">Login</button>
    </form>

    <hr>
    <h6 class="text-muted">New User? Create Account</h6>
    <form method="POST" action="/register">
      <div class="mb-2"><input type="text" name="username" class="form-control" placeholder="Choose username" required></div>
      <div class="mb-2"><input type="password" name="password" class="form-control" placeholder="Choose password" required></div>
      <button class="btn btn-outline-secondary w-100">Register</button>
    </form>
  </div>
</body>
</html>
