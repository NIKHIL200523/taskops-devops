<!DOCTYPE html>
<html>
<head>
  <title>TaskOps Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
  <div class="container col-md-4 card p-4 shadow-sm">
    <h3 class="text-center mb-3">TaskOps DevOps Portal</h3>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="POST">
      <div class="mb-3"><input type="text" name="username" class="form-control" placeholder="Username (admin)" required></div>
      <div class="mb-3"><input type="password" name="password" class="form-control" placeholder="Password (admin123)" required></div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
  </div>
</body>
</html>
