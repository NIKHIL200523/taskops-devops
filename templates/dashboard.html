<!DOCTYPE html>
<html>
<head>
  <title>TaskOps Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">TaskOps Deployment Tracker</span>
    <div>
      <a href="/api/health" target="_blank" class="btn btn-outline-info btn-sm me-2">API Health</a>
      <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
  </nav>
  <div class="container mt-4">
    <form action="/add" method="POST" class="row g-2 mb-4">
      <div class="col-md-6"><input type="text" name="title" class="form-control" placeholder="Task / Service Name (e.g., Auth Microservice)" required></div>
      <div class="col-md-4">
        <select name="env" class="form-select">
          <option value="AWS EC2 - Prod">AWS EC2 - Prod</option>
          <option value="Docker - Staging">Docker - Staging</option>
          <option value="Localhost - Dev">Localhost - Dev</option>
        </select>
      </div>
      <div class="col-md-2"><button class="btn btn-success w-100">Add Task</button></div>
    </form>

    <table class="table table-bordered bg-white shadow-sm">
      <thead class="table-secondary"><tr><th>ID</th><th>Task / Service</th><th>Environment</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        {% for t in tasks %}
        <tr>
          <td>{{ t[0] }}</td>
          <td>{{ t[1] }}</td>
          <td><span class="badge bg-info text-dark">{{ t[2] }}</span></td>
          <td><span class="badge {{ 'bg-success' if t[3]=='Completed' else 'bg-warning text-dark' }}">{{ t[3] }}</span></td>
          <td>
            <a href="/toggle/{{ t[0] }}" class="btn btn-sm btn-primary">Toggle Status</a>
            <a href="/delete/{{ t[0] }}" class="btn btn-sm btn-danger">Delete</a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
